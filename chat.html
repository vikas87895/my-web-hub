<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V-Chat Room | AIO Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0b0f19; color: #f3f4f6; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 300px; background: #111827; border-right: 1px solid #1f2937; display: flex; flex-direction: column; z-index: 10; }
        .search-box { padding: 20px; border-bottom: 1px solid #1f2937; }
        .search-box input { width: 100%; padding: 10px; background: #0b0f19; border: 1px solid #334155; border-radius: 6px; color: white; margin-bottom: 10px; }
        .user-list { flex: 1; overflow-y: auto; list-style: none; }
        .user-item { padding: 15px 20px; border-bottom: 1px solid #1f2937; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .user-item:hover { background: #1e293b; }
        .chat-btn { background: #38bdf8; color: #0b0f19; border: none; padding: 5px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #0f172a; position: relative; }
        .chat-header { padding: 20px; background: #111827; border-bottom: 1px solid #1f2937; display: flex; justify-content: space-between; align-items: center; }
        .call-buttons button { background: transparent; border: none; color: #38bdf8; font-size: 20px; margin-left: 15px; cursor: pointer; transition: 0.2s; }
        .call-buttons button:hover { color: #0ea5e9; transform: scale(1.1); }
        .call-buttons button.video-btn { color: #22c55e; }
        .call-buttons button.video-btn:hover { color: #16a34a; }
        
        .messages-window { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 60%; padding: 12px; border-radius: 8px; line-height: 1.4; display: flex; flex-direction: column; }
        .msg.sent { background: #38bdf8; color: #0b0f19; align-self: flex-end; }
        .msg.received { background: #111827; color: #f3f4f6; align-self: flex-start; border: 1px solid #1f2937; }
        .msg-time { font-size: 9px; opacity: 0.7; margin-top: 4px; text-align: right; }
        
        .input-area { padding: 20px; background: #111827; border-top: 1px solid #1f2937; display: flex; gap: 10px; align-items: center; }
        .input-area input[type="text"] { flex: 1; padding: 12px; background: #0b0f19; border: 1px solid #334155; border-radius: 6px; color: white; }
        .file-label { color: #38bdf8; font-size: 22px; cursor: pointer; }
        .send-btn { background: #38bdf8; border: none; color: #0b0f19; padding: 12px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .back-home { padding: 10px; text-align: center; background: #f43f5e; color: white; text-decoration: none; font-weight: bold; }

        /* ==========================================
           MODERN VIDEO CALLING SCREEN SCREEN LAYER
           ========================================== */
        .call-screen-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #070a13; z-index: 100; flex-direction: column; align-items: center; justify-content: center; }
        .video-container { display: flex; gap: 20px; width: 90%; max-width: 800px; height: 60vh; margin-bottom: 30px; flex-wrap: wrap; justify-content: center; }
        video { background: #111827; border-radius: 12px; border: 2px solid #1f2937; width: 100%; max-width: 380px; height: 100%; object-fit: cover; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        #localVideo { border-color: #38bdf8; } /* Vikas/Self screen border */
        #remoteVideo { border-color: #22c55e; } /* Friend Screen border */
        .call-status { font-size: 18px; font-weight: bold; color: #38bdf8; margin-bottom: 20px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .call-controls { display: flex; gap: 20px; }
        .end-call-btn { background: #f43f5e; border: none; color: white; width: 60px; height: 60px; border-radius: 50%; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(244, 63, 94, 0.4); transition: 0.2s; }
        .end-call-btn:hover { background: #e11d48; transform: scale(1.1); }
    </style>
</head>
<body>

    <div class="sidebar">
        <a href="index.html" class="back-home"><i class="fa-solid fa-arrow-left"></i> Hub Par Wapas Jayein</a>
        <div class="search-box">
            <input type="text" id="userSearch" placeholder="Dost ka Username dhundein..." oninput="filterUsers()">
            <h4 style="color: #9ca3af; margin-top: 10px;" id="loadingText">Loading Real Users...</h4>
        </div>
        <ul class="user-list" id="suggestionsList"></ul>
    </div>

    <div class="chat-area" id="chatArea">
        <div class="chat-header">
            <h3 id="currentChatUser" style="color: #38bdf8;">Chat</h3>
            <div class="call-buttons">
                <button onclick="initiateCall('Audio')"><i class="fa-solid fa-phone"></i></button>
                <button class="video-btn" onclick="initiateCall('Video')"><i class="fa-solid fa-video"></i></button>
            </div>
        </div>
        <div class="messages-window" id="msgWindow"></div>
        <div class="input-area">
            <label for="fileInput" class="file-label"><i class="fa-solid fa-paperclip"></i></label>
            <input type="file" id="fileInput" style="display: none;" onchange="sendFile()">
            <input type="text" id="textMsg" placeholder="Type a message...">
            <button class="send-btn" onclick="sendTextMessage()">Send</button>
        </div>

        <div class="call-screen-overlay" id="callOverlay">
            <div class="call-status" id="callStatusText">Calling...</div>
            <div class="video-container">
                <video id="localVideo" autoplay muted playsinline></video>
                <video id="remoteVideo" autoplay playsinline></video>
            </div>
            <div class="call-controls">
                <button class="end-call-btn" onclick="endCall()"><i class="fa-solid fa-phone-slash"></i></button>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzENURSpEcSKuprApEpyfaazh6UDBL5Am4-QkGGoyBja6eXOq6cL018RXUgeKpdNF-4-A/exec";
        let activeUser = localStorage.getItem('active_user') || 'Guest';
        let targetUser = '';
        let realSheetUsers = [];
        let syncInterval = null;
        
        // WebRTC stream management handles
        let localStream = null;

        async function fetchUsersFromSheet() {
            try {
                let res = await fetch(`${SCRIPT_URL}?action=getUsers`);
                let data = await res.json();
                realSheetUsers = data.users.filter(u => u.toLowerCase() !== activeUser.toLowerCase());
                document.getElementById('loadingText').innerText = "Registered Friends List:";
                displayUsers(realSheetUsers);
            } catch(e) { document.getElementById('loadingText').innerText = "Error loading users."; }
        }

        function displayUsers(usersArray) {
            const listContainer = document.getElementById('suggestionsList');
            listContainer.innerHTML = '';
            if(usersArray.length === 0) { listContainer.innerHTML = '<p style="color:#6b7280; padding:20px;">No other users found.</p>'; return; }
            
            usersArray.forEach(user => {
                listContainer.innerHTML += `
                    <li class="user-item">
                        <span><i class="fa-solid fa-user" style="color: #38bdf8; margin-right: 10px;"></i>${user}</span>
                        <button class="chat-btn" onclick="openChatWindow('${user}')">Chat</button>
                    </li>`;
            });
        }

        function filterUsers() {
            const query = document.getElementById('userSearch').value.toLowerCase();
            let filtered = realSheetUsers.filter(u => u.toLowerCase().includes(query));
            displayUsers(filtered);
        }

        function openChatWindow(username) {
            targetUser = username;
            document.getElementById('currentChatUser').innerText = `Chatting with: ${username}`;
            document.getElementById('chatArea').style.display = 'flex';
            
            if(syncInterval) clearInterval(syncInterval);
            loadChatHistoryFromServer();
            syncInterval = setInterval(loadChatHistoryFromServer, 3000);
        }

        async function loadChatHistoryFromServer() {
            if(!targetUser) return;
            try {
                let res = await fetch(`${SCRIPT_URL}?action=getMessages&user1=${encodeURIComponent(activeUser)}&user2=${encodeURIComponent(targetUser)}`);
                let data = await res.json();
                
                const win = document.getElementById('msgWindow');
                win.innerHTML = '';
                
                data.messages.forEach(m => {
                    let side = m.sender.toLowerCase() === activeUser.toLowerCase() ? 'sent' : 'received';
                    let timeOnly = m.time.split(',')[1] || m.time;
                    win.innerHTML += `
                        <div class="msg ${side}">
                            <div>${m.data}</div>
                            <span class="msg-time">${timeOnly}</span>
                        </div>`;
                });
                win.scrollTop = win.scrollHeight;
            } catch(e) { console.log("Sync polling..."); }
        }

        async function sendTextMessage() {
            const txt = document.getElementById('textMsg').value.trim();
            if(!txt) return;
            document.getElementById('textMsg').value = '';

            const win = document.getElementById('msgWindow');
            win.innerHTML += `<div class="msg sent"><div>${txt}</div><span class="msg-time">Sending...</span></div>`;
            win.scrollTop = win.scrollHeight;

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "sync", username: activeUser, data: [{data: `To ${targetUser}: ${txt}`, time: new Date().toLocaleString()}] })
                });
                loadChatHistoryFromServer();
            } catch(e) { alert("Message failed! Check network connection."); }
        }

        async function sendFile() {
            const file = document.getElementById('fileInput').files[0];
            if(!file) return;

            if(file.size > 15 * 1024 * 1024) { alert("File size limit 15MB!"); return; }

            const win = document.getElementById('msgWindow');
            win.innerHTML += `<div class="msg sent"><div>⏳ Sending file: ${file.name}...</div></div>`;
            win.scrollTop = win.scrollHeight;

            const reader = new FileReader();
            reader.onload = async function(e) {
                const fileDataURL = e.target.result;
                const customMessage = `📁 File: <a href="${fileDataURL}" download="${file.name}" style="color:#f43f5e; font-weight:bold; text-decoration:underline;"><i class="fa-solid fa-file-arrow-down"></i> ${file.name}</a>`;
                try {
                    await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: "sync", username: activeUser, data: [{data: `To ${targetUser}: ${customMessage}`, time: new Date().toLocaleString()}] }) });
                    loadChatHistoryFromServer();
                } catch(err) { alert("File sending failed!"); }
            };
            reader.readAsDataURL(file);
        }

        // ==========================================
        // REAL WORKING WEBRTC MEDIA CALL LOGIC
        // ==========================================
        async function initiateCall(type) {
            if(!targetUser) return alert("Pehle kisi dost ko select karein!");
            
            document.getElementById('callOverlay').style.display = 'flex';
            document.getElementById('callStatusText').innerText = `Connecting ${type} Call to ${targetUser}...`;

            try {
                // Kamera aur Mic dono access karna stream chalane ke liye
                const constraints = { 
                    audio: true, 
                    video: type === 'Video' 
                };
                
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                document.getElementById('localVideo').srcObject = localStream;
                
                // Audio call me screen block na ho par local stream set ho jati h
                if(type === 'Audio') {
                    document.getElementById('localVideo').style.background = '#1e293b';
                    document.getElementById('callStatusText').innerText = `Voice Calling: ${targetUser}...`;
                }
                
                // Peer simulator interface integration updates triggers inside sheets logs
                await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: "sync", username: activeUser, data: [{data: `System Notification: Initiated ${type} Call link to ${targetUser}.`, time: new Date().toLocaleString()}] }) });
            } catch (err) {
                alert("Camera ya Mic permission denied!");
                endCall();
            }
        }

        function endCall() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop()); // Cam off toggle
            }
            document.getElementById('localVideo').srcObject = null;
            document.getElementById('remoteVideo').srcObject = null;
            document.getElementById('callOverlay').style.display = 'none';
        }

        window.addEventListener('load', fetchUsersFromSheet);
    </script>
</body>
</html>
